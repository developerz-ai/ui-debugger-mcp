name: release

# Publishes @developerz.ai/ui-debugger-mcp to npm using OIDC trusted publishing —
# no NPM_TOKEN secret. npm mints a short-lived token from the GitHub Actions
# id-token and verifies it against the trusted publisher configured on npmjs.com.
# Provenance attestation is automatic.
#
# One-time prerequisites (on npmjs.com):
#   1. Bootstrap the first version manually (package must exist before a trusted
#      publisher can be attached) — see PUBLISHING notes.
#   2. Package -> Settings -> Trusted Publisher -> GitHub Actions:
#        Organization/user: developerz-ai
#        Repository:        ui-debugger-mcp
#        Workflow filename: release.yml

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # REQUIRED for OIDC — lets npm mint a token from this run

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pin the checkout to the ref the event fired on, so the tree that is
      # validated below is provably the tree `npm publish` publishes from
      # (an unpinned checkout floats to whatever the runner resolves).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      - name: upgrade npm
        run: npm install -g npm@latest

      # Bun is pinned to the version CI validates at (.github/workflows/ci.yml)
      # because the publication gate below depends on `bun test`'s path-filter
      # and exit-code semantics. On `latest` a Bun release could break or
      # silently alter that gate on a version the repo never tested.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: install
        run: bun install --frozen-lockfile

      - name: build
        run: bun run build

      # MANDATORY PUBLICATION GATE. The version-consistency tests already exist
      # (`src/index.test.ts` checks the source <-> package.json version and
      # server.json's two version fields; `src/mcp/registry-server-json.test.ts`
      # validates the registry metadata against its schema) but they only ran in
      # CI — neither publication route below was gated by them, so a release
      # could ship a drifted version to npm AND the MCP Registry.
      #
      # This step is deliberately unconditional and fatal: no `if:` (a skipped
      # step is missing validation), no `continue-on-error` (a failed step must
      # fail the job). It runs AFTER `build` and BEFORE both publish steps, so
      # a drifted version never reaches npm or the registry.
      - name: validate version consistency
        run: |
          echo "publishing revision: $(git rev-parse HEAD)"
          bun test src/index.test.ts src/mcp/registry-server-json.test.ts

      # Skip if this version is already on npm, so the job stays re-runnable: a run
      # that published to npm but failed afterwards (or a workflow_dispatch to
      # publish only the registry half) must not die here on E403 "cannot publish
      # over an existing version" before reaching the steps that still have work.
      - name: publish
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm — skipping publish"
          else
            npm publish
          fi

      # MCP Registry, on the SAME OIDC identity as npm above — no token, no
      # interactive login. `github-oidc` authorizes the `io.github.developerz-ai/*`
      # namespace from this run's repository owner, which is why the server.json
      # name must stay under that namespace.
      #
      # Must run AFTER `npm publish`: the registry resolves the npm package named in
      # server.json and rejects a version it cannot find, so publishing here first
      # would fail on a package that does not exist yet.
      - name: install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
