# Weekly, grouped, quiet (owner, 2026-11-26): every ecosystem Monday; minor and patch updates as one
# PR per ecosystem, security updates as one more; a major update arrives on its own. The
# developerz.ai maintainer's own advisory watch is off, so this file is the dependency-advisory lane.
# The 14-day cooldown lets a compromised release get caught before it reaches us. Security updates
# are unaffected.
version: 2
updates:
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/dummy/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      bun-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
