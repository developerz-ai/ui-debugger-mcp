# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy: developerz-ai/ui-debugger-mcp
#
# AI-maintained since 2026-09-11, authorized by the repo owner. Only the values below are pinned;
# everything else rides the schema defaults. What stands behind a merge is this repo's own CI and
# ruleset, not this file: read them before trusting a sentence here about them.
version: 1

pr:
  auto_merge: true
  # An outside contributor's pull request and a member's wait for a member.
  auto_merge_scope: own_and_dependency_bots
  # The two bots that review code here. Dependabot opens update PRs but reviews nothing.
  wait_for_other_bots: [coderabbit, copilot]
  # A PR waiting on its author (red check, open thread, conflict) is closed after 60 days
  # (owner, 2026-11-26: the open-source repos' 60-day stale rule).
  close_awaiting_author_after_days: 60

# Quiet issues are commented on, then closed, after 60 days; one waiting on its reporter for a
# reproduction closes after 60 too (owner, 2026-11-26: the 60-day stale rule).
triage:
  stale_after_days: 60
  stale_action: comment_then_close
  close_unanswered_repro_after_days: 60

handoff:
  # The bot scopes a qualified issue and hands it to the fleet without asking the reporter first.
  mode: fleet
  ask_reporter_first: false

review:
  # Native review on, beside CodeRabbit (`force` beats an active incumbent). Advisory: it comments,
  # never requests changes and never approves, so green CI and the ruleset stay the gate.
  enabled: true
  force: true
  request_changes: false
  approval: false

release:
  # release.yml owns the publish (`on: release: published` -> npm + MCP registry), so there is no
  # release manager and no channel for the agent to publish on. Whether to release is the weekly
  # `release-due` checkup's call (.dz/schedules/release-due.md): a merge never cuts one.
  manager: "none"
  channels: []

# Added by the developerz.ai maintainer agent: blocks from the current template this file did not have. Each states the value already in effect; edit it like any other key.

# branches: on at 60 because this file exists. A branch with no new commit
# this long is tagged archive/<branch>/<date> at its last commit, then deleted.
# false keeps every branch. See /docs/maintainer-yml.
branches:
  close_inactive_after_days: 60 # owner, 2026-11-26: 60 days idle, archive-tagged then deleted

# escalate: what stays with a human.
#   - `always` is the schema default, written out so you can see it.
#   - `ask_before_acting` is empty by default: no pull request waits on a human
#     ack. Write categories (e.g. [large_pr, breaking_change]) to opt in.
#     `pr.human_merge` paths still hold; security, license and CLA still escalate.
escalate:
  always: [hostile_tone, direct_mention]

# scout: the platform's daily survey of this repo files only what is already BROKEN
# (red CI, failing tests, a security advisory, a broken build or link) — never an
# improvement idea. `full` lets it file ideas too; `off` stops the survey.
scout:
  survey: broken_only

# devops: off (owner, 2026-11-26): one PR per advisory was noise. Dependabot security updates
# (.github/dependabot.yml `*-security` groups, one PR per ecosystem) are the advisory lane.
devops:
  watch: off

# care: docs_drift off (47 tasks -> 8 docs-only merges, 33 failed over 30 days, both accounts).
care:
  docs_drift: "off"

# The checkups nothing else triggers (owner, 2026-11-26: releases weekly and judged, routine
# maintenance weekly, improvement twice a month). Hours offset from the rest of the fleet.
schedules:
  - name: release-due
    days: [mon]
    hours_utc: [5]
    brief_file: .dz/schedules/release-due.md
  - name: maintain
    days: [mon]
    hours_utc: [7]
    brief_file: .dz/schedules/maintain.md
    mode: devops
    outcome: pr
  - name: improve
    days: [mon]
    weeks_of_month: [1, 3]
    hours_utc: [11]
    brief_file: .dz/schedules/improve.md
